spring.application.name=consumer

spring.kafka.consumer.bootstrap-servers= localhost:9092
spring.kafka.consumer.group-id= order-group
spring.kafka.consumer.key-deserializer= org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer= org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages= com.kafka.consumer.dto
spring.kafka.consumer.properties.spring.json.type.mapping=com.kafka.producer.dto.OrderEvent:com.kafka.consumer.dto.OrderEvent
